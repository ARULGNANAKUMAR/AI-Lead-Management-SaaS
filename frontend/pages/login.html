<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Lead Compass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">🧭</div>
        <span class="auth-logo-text">Lead Compass</span>
      </div>

      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-subheading">Sign in to manage your leads and grow your pipeline.</p>

      <div id="auth-error" class="auth-error hidden"></div>

      <a id="google-btn" class="btn-google" href="#">
        <svg class="google-icon" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </a>

      <div class="features-list">
        <div class="feature-item">
          <div class="feature-check">✓</div>
          <span>Capture and manage leads in one place</span>
        </div>
        <div class="feature-item">
          <div class="feature-check">✓</div>
          <span>Embeddable widget for your website</span>
        </div>
        <div class="feature-item">
          <div class="feature-check">✓</div>
          <span>Analytics and pipeline tracking</span>
        </div>
      </div>

      <div class="auth-footer">
        By continuing, you agree to our Terms of Service and Privacy Policy.
      </div>
    </div>
  </div>

  <script type="module">
    import CONFIG from '../js/config.js';

    // Check for error param
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const el = document.getElementById('auth-error');
      const msgs = {
        invalid_state: 'Login session expired. Please try again.',
        no_code: 'Google login was cancelled.',
      };
      el.textContent = msgs[error] || 'Login failed. Please try again.';
      el.classList.remove('hidden');
    }

    // Set Google login URL
    document.getElementById('google-btn').href = CONFIG.API_BASE + '/auth/google';
  </script>
</body>
</html>
